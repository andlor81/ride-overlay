[build-system]
requires = ["hatchling"]            # pip downloads hatchling first
build-backend = "hatchling.build"   # then calls its build functions

[project]
name = "ride-overlay"
version = "0.1.0"
description = "Floating macOS overlay showing live ANT+ power, cadence and heart rate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["openant"]

[project.scripts]
ride-overlay = "ride_overlay.__main__:main"