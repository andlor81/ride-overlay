[build-system]
requires = ["hatchling"]            # pip downloads hatchling first
build-backend = "hatchling.build"   # then calls its build functions

[project]
name = "ride-overlay"
version = "0.1.0"
description = "Floating macOS overlay showing live ANT+ power, cadence and heart rate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openant",
    "libusb-package",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.scripts]
ride-overlay = "ride_overlay.__main__:main"

[tool.briefcase]
project_name = "ride-overlay"
bundle = "io.github.andlor81"
version = "0.1.0"
url = "https://github.com/andlor81/ride-overlay"
license = "MIT"
license-files = ["LICENSE"]
author = "Andreas Lorenz"

[tool.briefcase.app.ride-overlay]
formal_name = "Ride Overlay"
description = "Floating macOS overlay showing live ANT+ power, cadence and heart rate"
icon = "icons/ride-overlay"
sources = ["src/ride_overlay"]
requires = [
    "openant",
    "libusb-package",
]

[tool.briefcase.app.ride-overlay.macOS]
requires = [
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
]
universal_build = false  # build for this Mac's CPU only (for now)
info."LSUIElement" = true  # menu bar app: no Dock icon, no app menu