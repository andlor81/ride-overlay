<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b303c"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.5" stop-color="#5e5ce6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff453a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.25" stop-color="#32d3f5"/>
      <stop offset="0.45" stop-color="#30d158"/>
      <stop offset="0.6" stop-color="#ffd60a"/>
      <stop offset="0.8" stop-color="#ff9f0a"/>
      <stop offset="1" stop-color="#ff453a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d158"/>
      <stop offset="0.5" stop-color="#ff9f0a"/>
      <stop offset="1" stop-color="#ff453a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#9aa0ad"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- base: dark rounded square with a soft shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <!-- wheel: spokes, hub, tire and rim -->
    <g stroke="#555b68" stroke-width="9" stroke-linecap="round">
      <line x1="512" y1="512" x2="512" y2="282"/>
      <line x1="512" y1="512" x2="627" y2="313"/>
      <line x1="512" y1="512" x2="711" y2="397"/>
      <line x1="512" y1="512" x2="742" y2="512"/>
      <line x1="512" y1="512" x2="711" y2="627"/>
      <line x1="512" y1="512" x2="627" y2="711"/>
      <line x1="512" y1="512" x2="512" y2="742"/>
      <line x1="512" y1="512" x2="397" y2="711"/>
      <line x1="512" y1="512" x2="313" y2="627"/>
      <line x1="512" y1="512" x2="282" y2="512"/>
      <line x1="512" y1="512" x2="313" y2="397"/>
      <line x1="512" y1="512" x2="397" y2="313"/>
    </g>
    <circle cx="512" cy="512" r="30" fill="#7d8494"/>
    <circle cx="512" cy="512" r="262" fill="none" stroke="#1b1e25" stroke-width="30"/>
    <circle cx="512" cy="512" r="290" fill="none" stroke="url(#rim)" stroke-width="30"/>

    <!-- lightning bolt: power, in training zone colors -->
    <polygon points="610,215 385,560 505,560 410,830 668,445 545,445"
             fill="url(#bolt)" filter="url(#glow)"/>

    <!-- heart rate pulse line -->
    <polyline points="640,650 712,650 738,592 772,712 802,620 826,650 880,650"
              fill="none" stroke="url(#pulse)" stroke-width="22"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- glowing edge: blue to red, like the zone colors -->
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none"
        stroke="url(#edge)" stroke-width="8" filter="url(#glow)"/>
</svg>
